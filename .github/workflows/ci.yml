name: Validate

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ffmpeg pkg-config libavcodec-dev libavutil-dev libswresample-dev
      - name: Validate release metadata and documentation
        run: python3 tools/validate-metadata.py
      - name: Run sanitizer-backed host tests
        run: tools/test.sh
